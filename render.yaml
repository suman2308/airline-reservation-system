# =============================================
# AeroBook – Render Blueprint
# =============================================
# Deploy with one click:
#   1. Push this file to GitHub (it's in the repo root)
#   2. https://dashboard.render.com/blueprints → New Blueprint Instance
#   3. Select this repository → Render reads render.yaml automatically
#   4. Click Apply — that's it.
#
# ─── All-in-one mode (default) ───
# The Dockerfile bundles MariaDB inside the container. docker/entrypoint.sh
# boots it, creates the database, and seeds database/aerobook.sql automatically
# on first boot — NO external database required.
#
# ⚠️ Free plan: ephemeral filesystem + spin-down → all runtime data (users,
#    bookings) resets on every restart/redeploy. This is a DEMO deployment.
#    For persistent data, switch to an external MySQL (Aiven/TiDB Cloud):
#    set DB_HOST/DB_USER/DB_PASS/DB_NAME to the external values and import
#    database/aerobook.sql there. See docs/DEPLOY_RENDER.md.
# =============================================

services:
  - type: web
    name: aerobook
    runtime: docker
    repo: https://github.com/suman2308/airline-reservation-system
    plan: free          # or starter (always-on)
    region: singapore   # pick closest to your users
    dockerfilePath: ./Dockerfile
    port: 80            # matches EXPOSE 80 in the Dockerfile
    healthCheckPath: /health.php
    envVars:
      # ─── Bundled MariaDB (all-in-one). Override to point at external MySQL. ───
      - key: DB_HOST
        value: 127.0.0.1
      - key: DB_USER
        value: aerobook
      - key: DB_PASS
        value: aerobook_secret
      - key: DB_NAME
        value: aerobook_db
      # BASE_URL can be left empty — the app auto-detects https behind
      # Render's TLS proxy (X-Forwarded-Proto). Set it explicitly only if
      # you use a custom domain and want a hardcoded URL.
      - key: BASE_URL
        value: ''
      # ─── Optional ───
      - key: MAIL_MODE
        value: log
      - key: MAIL_FROM
        value: noreply@aerobook.in
      - key: MAINTENANCE_MODE
        value: 'false'
      - key: AVIATIONSTACK_ENABLED
        value: 'false'
      - key: AVIATIONSTACK_API_KEY
        sync: false
